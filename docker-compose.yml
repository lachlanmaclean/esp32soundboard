services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gooseboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gooseboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback-only, so the host-networked `bot` service can reach it via
    # 127.0.0.1 without exposing it beyond this machine.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gooseboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs `prisma migrate deploy` against postgres, then exits. server/portal
  # depend on it completing so schema is always up to date on deploy.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    environment:
      DATABASE_URL: postgresql://gooseboard:${POSTGRES_PASSWORD}@postgres:5432/gooseboard
    depends_on:
      postgres:
        condition: service_healthy

  # Public API: device pairing, sound uploads, config. Plain HTTP - the
  # default bridge network is fine here and keeps normal Traefik routing.
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://gooseboard:${POSTGRES_PASSWORD}@postgres:5432/gooseboard
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      PORTAL_URL: ${PORTAL_URL}
      UPLOAD_DIR: /data/uploads
      BOT_INTERNAL_URL: http://host.docker.internal:4100
      FLARESOLVERR_URL: http://flaresolverr:8191
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Not service_healthy: the bot's healthcheck only passes once it's
      # finished logging into Discord, which is an external dependency that
      # can be slow or flaky. Gating the API's own startup on that turned
      # one slow Discord login into the whole app being unreachable -
      # service_started (just "the container exists") is enough here.
      bot:
        condition: service_started
      flaresolverr:
        condition: service_started

  # Runs myinstants.com scrape requests through a real headless browser so
  # they clear Cloudflare's bot checks - plain curl/fetch from this host's
  # IP gets a flat 403 (datacenter IP reputation), regardless of headers.
  # Internal only; `server` is the only thing that talks to it.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    expose:
      - "8191"

  # Discord bot + voice playback, run with host networking. Discord voice
  # needs direct outbound UDP for its IP-discovery handshake, which the
  # default Docker bridge network's NAT breaks - this bypasses that layer
  # entirely. Not reachable publicly; `server` proxies to it internally.
  bot:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "apps/server/dist/bot-index.js"]
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgresql://gooseboard:${POSTGRES_PASSWORD}@127.0.0.1:5432/gooseboard
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      PORTAL_URL: ${PORTAL_URL}
      UPLOAD_DIR: /data/uploads
      BOT_INTERNAL_PORT: "4100"
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4100/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        # Baked in at build time: the browser fetches audio files directly from
        # here, so it must be the server's public domain, not the internal one.
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gooseboard:${POSTGRES_PASSWORD}@postgres:5432/gooseboard
      NEXTAUTH_URL: ${PORTAL_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      SERVER_INTERNAL_URL: http://server:4000
      OWNER_DISCORD_ID: ${OWNER_DISCORD_ID}
    expose:
      - "3000"
    # Healthcheck and condition-based depends_on deliberately removed here -
    # the site went down and a domain toggle didn't bring it back while
    # these were in place, so this is a direct suspect. Reverted to a plain
    # startup-order dependency (no health gating at all) to rule it out
    # while the actual outage gets debugged from container logs.
    depends_on:
      - postgres
      - migrate
      - server

volumes:
  postgres_data:
  uploads_data:
