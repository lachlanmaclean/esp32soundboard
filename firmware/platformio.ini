; Gooseboard CYD firmware
;
; Target: ESP32-2432S028R ("Cheap Yellow Display") — ESP32-D0WD, 2.8" 320x240
; ILI9341 with a resistive XPT2046 touch panel. Pin mapping lives in
; src/display.h; adjust there if your board revision differs.

[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; TLS + LovyanGFX + WiFiManager fills ~88% of the default 1.3MB app slot.
; No OTA here, so trade the second app partition for headroom.
board_build.partitions = huge_app.csv

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.1.0
    ricmoo/QRCode@^0.0.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Public URL of the bot's API (the `server` service).
    -DGOOSEBOARD_API_BASE='"https://goosepi.countrculture.com"'
    ; Public URL of the web portal — the QR code points at its /pair page.
    -DGOOSEBOARD_PORTAL_BASE='"https://goose.countrculture.com"'

; One-time touch calibration: `pio run -e cyd_calibrate -t upload`, tap the
; four crosshairs on screen, then copy the 8 numbers it prints (both on
; screen and over serial) into kTouchCalibration in src/display.h. Rebuild
; the normal `cyd` env after.
[env:cyd_calibrate]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DGOOSEBOARD_CALIBRATE_TOUCH
